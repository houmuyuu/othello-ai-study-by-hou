# cargo-about の設定：配布用の exe に組み込まれるライブラリのライセンス表示（THIRD_PARTY_LICENSES.html）を作る
#
#   cargo about generate --features cuda about.hbs -o THIRD_PARTY_LICENSES.html
#
# accepted に含まれないライセンスのライブラリが依存に加わると生成が失敗するので、内容を確認してから追加する。

# 配布するのは Windows 版だけなので、Windows でリンクされるライブラリに絞る
targets = ["x86_64-pc-windows-msvc"]
# ビルドスクリプト・テスト用のライブラリは exe に含まれない
ignore-build-dependencies = true
ignore-dev-dependencies = true
# 自分自身（このプロジェクト）は一覧に含めない
private = { ignore = true }

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "Unlicense",
    "0BSD",
    "CC0-1.0",
    "WTFPL",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

# Cargo.toml にライセンスの記載がないが、LICENSE ファイルに Apache-2.0 と書かれている
[cfg_block.clarify]
license = "Apache-2.0"

[[cfg_block.clarify.files]]
path = "LICENSE"
license = "Apache-2.0"
checksum = "408bbc4d10bdf74d8c9b74b64ea4910603257e24133da18edc4d16198e3b4010"
