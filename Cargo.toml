[package]
name = "othello"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
default-run = "othello"

[features]
# GPU (CUDA) での学習・自己対戦。強化学習ツール（rl）に必要
cuda = ["burn/cuda"]

[dependencies]
burn = { version = "0.22.0", features = ["flex", "autodiff", "optim", "store"] }
eframe = "0.36.2"

[[bin]]
name = "rl"
required-features = ["cuda"]
